<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titleHome">Kaola Abidi — Portfolio</title>
  <meta name="description" content="Kaola Abidi — graphic & web design student. Selected works 2025—2026.">
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.classList.add('js');try{if(sessionStorage.getItem('nav')){sessionStorage.removeItem('nav');document.documentElement.classList.add('from-nav')}}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="Index">
  <div class="loader" aria-hidden="true"><div class="ld-inner"><span class="ld-logo">Kaola Abidi</span><div class="ld-track"><div class="ld-fill" data-ld-bar></div></div></div></div>
  <header class="site-header">
    <a href="index.html" class="brand rv" style="--d:.1s" data-label="Index">Kaola Abidi</a>
    <nav class="hd-nav rv" style="--d:.3s"><a class="ulink" href="about.html" data-label="About" data-i18n="navAbout">About</a><a class="ulink" href="playground.html" data-label="Playground" data-i18n="navGraphic">Graphic design</a></nav>
  </header>
  <main class="home" id="home">
    <!-- Layout 1 : bande horizontale -->
    <section class="home-slider" id="slider">
      <div class="home-stage">
        <p class="home-intro-m rv" data-i18n="homeIntro"><span class="accent">(Selected works)</span><br>Graphic &amp; web design student, ©2026</p>
        <div class="strip" id="strip"></div>
      </div>
      <nav class="home-list" id="homeList" aria-label="Projects" data-i18n-aria="homeProjects"></nav>
      <p class="home-statement fd" style="--d:1.1s" data-i18n="homeStatement">Minimal, intentional <em>digital identities</em> — between branding, editorial and the web.</p>
    </section>

    <!-- Layout 2 : diagonale -->
    <section class="home-diag" id="diag">
      <div class="dg-line" id="dgList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="ft-mid layout-switch rv" style="--d:1.2s" role="group">
      <span class="ft-dim" data-i18n="layoutLabel">View</span>
      <button class="ulink" data-layout="slider" data-i18n="layoutSlider">Slider</button>
      <span class="ft-dim">/</span>
      <button class="ulink" data-layout="diagonal" data-i18n="layoutDiagonal">Diagonal</button>
    </div>
    <button class="ft-contact ulink rv" style="--d:1.3s" data-contact data-i18n="navContact">Contact</button>
  </footer>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
